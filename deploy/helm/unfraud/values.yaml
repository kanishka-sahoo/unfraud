# Defaults are the `lite` profile: everything must fit in about 4 GB of
# cluster memory on an 8 GB machine. values-full.yaml overrides for bigger
# machines.

image:
  repository: unfraud
  tag: dev
  pullPolicy: IfNotPresent

kafka:
  name: unfraud
  replicas: 1
  storage: 10Gi
  heap: 512m
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 1Gi }
  # Host access through kind's port mappings (see deploy/kind/cluster.yaml).
  external:
    bootstrapNodePort: 30092
    brokerNodePort: 30093
  topicOperator:
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { memory: 256Mi }

# One ordered input topic per Profile (ADR-0013).
profiles:
  - name: ieee-cis
    partitions: 3
  - name: paysim
    partitions: 3
  - name: elliptic
    partitions: 3

valkey:
  image: valkey/valkey:8.1-alpine
  maxmemory: 384mb
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 448Mi }
    limits: { memory: 448Mi }

scorer:
  replicas: 1
  # Event Time alignment across partitions (ADR-0016). Off only to measure it.
  align: true
  goMemLimit: 200MiB
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits: { memory: 256Mi }
  # Profile -> model image. A scorer runs for each entry (set by `make deploy-model`).
  models: {}
  # Profile -> Shadow Model image, scored alongside and never acted on.
  shadowModels: {}

postgres:
  name: cases
  instances: 1
  storage: 4Gi
  sharedBuffers: 64MB
  resources:
    requests: { cpu: 100m, memory: 320Mi }
    limits: { memory: 320Mi }

cases:
  goMemLimit: 100MiB
  resources:
    requests: { cpu: 200m, memory: 128Mi }
    limits: { memory: 128Mi }

summarizer:
  enabled: true
  # stub needs no key; openrouter needs the openrouter Secret (make secrets).
  driver: stub
  model: anthropic/claude-haiku-4.5
  providers: ""
  minAction: 1
  perMinute: 0
  resources:
    requests: { cpu: 50m, memory: 48Mi }
    limits: { memory: 64Mi }

graph:
  goMemLimit: 600MiB
  resources:
    requests: { cpu: 500m, memory: 768Mi }
    limits: { memory: 768Mi }
  # Profile -> Revision model image. graph-svc runs for each entry.
  models: {}

observability:
  enabled: true
  prometheusImage: prom/prometheus:v3.13.4
  grafanaImage: grafana/grafana:13.2.3
  retention: 12h

web:
  # Reachable at http://localhost:30080 through kind's port mapping.
  nodePort: 30080

# Rendered on demand by `make replay`, never by `helm install`.
replay:
  profile: ""
  runId: ""
  speed: 0
  limit: 0
  # The dataset root mounted into the kind node.
  dataPath: /data
  # Soft heap limit for the Go runtime, below the container limit.
  goMemLimit: 400MiB
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { memory: 512Mi }
