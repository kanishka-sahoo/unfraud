# Defaults are the `lite` profile: everything must fit in about 4 GB of
# cluster memory on an 8 GB machine. values-full.yaml overrides for bigger
# machines.

image:
  repository: unfraud
  tag: dev
  pullPolicy: IfNotPresent

kafka:
  name: unfraud
  replicas: 1
  storage: 10Gi
  heap: 512m
  # Off-heap memory (index rebuilds and memory-mapped segments on restart)
  # outgrew 1Gi once two datasets' topics were loaded: Kafka was OOM-killed
  # recovering its logs.
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 1536Mi }
  # Host access through kind's port mappings (see deploy/kind/cluster.yaml).
  external:
    bootstrapNodePort: 30092
    brokerNodePort: 30093
  topicOperator:
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { memory: 256Mi }

# One ordered input topic per Profile (ADR-0013).
profiles:
  - name: tabformer
    partitions: 3

valkey:
  image: valkey/valkey:8.1-alpine
  maxmemory: 384mb
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 448Mi }
    limits: { memory: 448Mi }

scorer:
  replicas: 1
  # Event Time alignment across partitions (ADR-0016). Off only to measure it.
  align: true
  goMemLimit: 200MiB
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits: { memory: 256Mi }
  # Profile -> model image. A scorer runs for each entry (set by `make deploy-model`).
  models: {}
  # Profile -> Shadow Model image, scored alongside and never acted on.
  shadowModels: {}

postgres:
  name: cases
  instances: 1
  storage: 4Gi
  sharedBuffers: 64MB
  resources:
    requests: { cpu: 100m, memory: 320Mi }
    limits: { memory: 320Mi }

cases:
  goMemLimit: 150MiB
  resources:
    requests: { cpu: 200m, memory: 192Mi }
    limits: { memory: 192Mi }

assistant:
  enabled: true
  # Summaries, written only when an analyst asks (ADR-0022).
  summaries:
    # anthropic: the Claude API, or any Anthropic-compatible API at baseURL.
    # openai: any OpenAI-compatible API at baseURL (OpenAI, vLLM, Ollama...).
    # openrouter: OpenRouter, with model ids such as anthropic/claude-haiku-5.5.
    # stub: template summaries, no key. Keys come from .env (make secrets);
    # without one, a driver writes template summaries (ADR-0021).
    driver: anthropic
    model: claude-haiku-5-5
    baseURL: ""
    # anthropic only; "" leaves the model's default. Summaries need little thought.
    effort: low
    # openai and openrouter only; "" sends none (Claude 5 models reject others).
    temperature: ""
    providers: ""
    # Caps spend if many are requested at once.
    perMinute: 30
  # The assistant chat (Investigations): Claude only, with ANTHROPIC_API_KEY;
  # without it a scripted stub answers.
  chat:
    # Haiku keeps the chat fast and cheap; claude-sonnet-5-5 reasons further.
    model: claude-haiku-5-5
    baseURL: ""
    effort: medium
    # Most tokens one conversation may use; 0 = no limit.
    tokenBudget: 400000
    # Questions answered at once; more are asked to retry.
    concurrency: 4
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

graph:
  goMemLimit: 600MiB
  resources:
    requests: { cpu: 500m, memory: 768Mi }
    limits: { memory: 768Mi }
  # Profile -> Revision model image. graph-svc runs for each entry.
  models: {}

observability:
  enabled: true
  prometheusImage: prom/prometheus:v3.13.4
  grafanaImage: grafana/grafana:13.2.3
  retention: 12h

web:
  # Reachable at http://localhost:30080 through kind's port mapping.
  nodePort: 30080

# Rendered on demand by `make replay`, never by `helm install`.
replay:
  profile: ""
  runId: ""
  speed: 0
  limit: 0
  # The dataset root mounted into the kind node.
  dataPath: /data
  # Soft heap limit for the Go runtime, below the container limit.
  goMemLimit: 400MiB
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { memory: 512Mi }
