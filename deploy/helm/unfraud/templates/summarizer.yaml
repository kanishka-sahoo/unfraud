{{- if .Values.summarizer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarizer
  labels:
    app.kubernetes.io/name: summarizer
    {{- include "unfraud.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: summarizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: summarizer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: summarizer
          image: {{ .Values.image.repository }}/summarizer:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -driver={{ .Values.summarizer.driver }}
            - -model={{ .Values.summarizer.model }}
            - -providers={{ .Values.summarizer.providers }}
            - -min-action={{ .Values.summarizer.minAction }}
            - -per-minute={{ .Values.summarizer.perMinute }}
          env:
            - name: PG_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.name }}-app, key: uri }
            {{- if eq .Values.summarizer.driver "openrouter" }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: { name: openrouter, key: api-key }
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.summarizer.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
{{- end }}
