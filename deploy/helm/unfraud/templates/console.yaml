# cases-api and the web console. cases-api may create replayer Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: casesapi
  labels: {{- include "unfraud.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: casesapi-replays
  labels: {{- include "unfraud.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: casesapi-replays
  labels: {{- include "unfraud.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: casesapi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: casesapi-replays
---
apiVersion: v1
kind: Service
metadata:
  name: casesapi
  labels: {{- include "unfraud.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: casesapi }
  ports: [{ name: http, port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casesapi
  labels:
    app.kubernetes.io/name: casesapi
    {{- include "unfraud.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: casesapi } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: casesapi }
    spec:
      serviceAccountName: casesapi
      containers:
        - name: casesapi
          image: {{ .Values.image.repository }}/casesapi:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -brokers={{ include "unfraud.bootstrap" . }}
            - -graph-url=http://graphsvc-%s:8080
            - -assistant-url={{ if .Values.assistant.enabled }}http://assistant:8080{{ end }}
            - -namespace={{ .Release.Namespace }}
            - -replayer-image={{ .Values.image.repository }}/replayer:{{ .Values.image.tag }}
            - -data-path={{ .Values.replay.dataPath }}
          env:
            - name: PG_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.name }}-app, key: uri } }
            - name: GOMEMLIMIT
              value: "80MiB"
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "unfraud.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: http, port: 3000, nodePort: {{ .Values.web.nodePort }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    {{- include "unfraud.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: web } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web }
    spec:
      containers:
        - name: web
          image: {{ .Values.image.repository }}/web:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CASES_API_URL
              value: http://casesapi:8080
            - name: NODE_OPTIONS
              value: --max-old-space-size=160
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /benchmarks, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 224Mi }
            limits: { memory: 224Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
