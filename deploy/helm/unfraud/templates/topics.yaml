{{- range $p := .Values.profiles }}
{{- range $prefix := list "input" "scored" "revised" }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ $prefix }}.{{ $p.name }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name }}
    {{- include "unfraud.labels" $ | nindent 4 }}
spec:
  partitions: {{ $p.partitions }}
  replicas: {{ min 3 $.Values.kafka.replicas }}
  config:
    compression.type: producer
{{- end }}
{{- end }}
