# The `full` profile, for machines with about 16 GB of RAM.
kafka:
  replicas: 3
  heap: 1g
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 2Gi }

profiles:
  - name: tabformer
    partitions: 12
  - name: sparkov
    partitions: 12
  - name: amlworld
    partitions: 12
  - name: paysim
    partitions: 12
