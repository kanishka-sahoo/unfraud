# Rendered by deploy/kind/up.sh, which substitutes ${DATA_DIR}.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: unfraud
nodes:
  - role: control-plane
    extraMounts:
      # Datasets are mounted read-only so replayer Jobs can read them without
      # copying gigabytes into images or volumes.
      - hostPath: ${DATA_DIR}
        containerPath: /data
        readOnly: true
    extraPortMappings:
      # Kafka's external listener, for tools and tests running on the host.
      - containerPort: 30092
        hostPort: 30092
        listenAddress: 127.0.0.1
      - containerPort: 30093
        hostPort: 30093
        listenAddress: 127.0.0.1
