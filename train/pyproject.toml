[project]
name = "unfraud-train"
version = "0.1.0"
description = "Offline training and evaluation for unfraud"
requires-python = ">=3.12"
dependencies = [
  "lightgbm>=4.6",
  "catboost>=1.2",
  "polars>=1.30",
  "pyarrow>=20",
  "numpy>=2.2",
  "scikit-learn>=1.7",
]

[project.scripts]
unfraud-train = "unfraud_train.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unfraud_train"]
